name: Mise a jour des actions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 2,4'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Script Migros
        run: python3 migros_actions.py

      - name: Script Coop
        run: python3 coop_actions.py

      - name: Script Aldi
        run: python3 aldi_actions.py

      - name: Script Lidl
        run: python3 lidl_actions.py

      - name: Script Denner
        run: python3 denner_actions.py

      - name: Sauvegarder les JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *_import.json
          git commit -m "Mise a jour hebdomadaire" || exit 0
          git checkout -- .
          git clean -fd
          git pull --rebase
          git push
