name: Mise a jour des actions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 2,4'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: |
          pip install requests curl_cffi playwright playwright-stealth beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Script Migros
        run: python3 migros_actions.py

      - name: Script Aldi
        run: python3 aldi_actions.py

      - name: Script Lidl
        run: python3 lidl_actions.py

      - name: Script Denner
        run: python3 denner_actions.py

      - name: Activer le VPN pour Coop
        if: env.HAS_WG == 'true'
        env:
          HAS_WG: ${{ secrets.WG_CONFIG != '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          echo "${{ secrets.WG_CONFIG }}" | grep -v "^DNS" | sed '/\[Interface\]/a MTU = 1280' | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo wg-quick up wg0
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo resolvectl dns wg0 1.1.1.1 9.9.9.9 || true
          curl -4 -s --max-time 10 https://api.ipify.org && echo " (IPv4 VPN active)"

      - name: Script Coop
        run: python3 coop_actions.py

      - name: Couper le VPN
        if: always()
        run: sudo wg-quick down wg0 || true

      - name: Sauvegarder les JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *_import.json
          git commit -m "Mise a jour hebdomadaire" || exit 0
          git checkout -- .
          git clean -fd
          git pull --rebase
          git push
