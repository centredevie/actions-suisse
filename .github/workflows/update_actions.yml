name: Mise à jour des actions (Migros & Coop)

on:
  # Permet de lancer le script manuellement d'un clic sur GitHub pour tester
  workflow_dispatch:
  # Se lance automatiquement tous les mardis à 07h00 (heure suisse)
  schedule:
    - cron: '0 6 * * 2'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances et le navigateur pour Coop
        run: |
          pip install requests playwright beautifulsoup4
          playwright install chromium
          playwright install-deps chromium

      - name: Exécuter le script Migros
        run: python3 migros_actions.py

      # Décommentez la ligne suivante dès que coop_actions.py sera prêt :
       - name: Exécuter le script Coop
         run: python3 coop_actions.py

      - name: Sauvegarder les nouveaux fichiers JSON sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *_import.json
          git commit -m "Mise à jour hebdomadaire des actions" || exit 0
          git push
