name: Test Coop

on:
  workflow_dispatch: {}   # lancement à la main depuis l'onglet Actions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Tester l'accès à Coop
        run: python coop_test.py
